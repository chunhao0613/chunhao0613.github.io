name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-portfolio/package-lock.json

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            my-portfolio/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('my-portfolio/package-lock.json') }}-${{ hashFiles('my-portfolio/src/**/*.[jt]s', 'my-portfolio/src/**/*.[jt]sx', 'my-portfolio/src/**/*.css', 'my-portfolio/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('my-portfolio/package-lock.json') }}-

      # 只有字元集變動時才需要重新下載 7.4MB 的原始字型，
      # 快取住可讓大多數建置完全跳過網路存取。
      - name: Restore source font cache
        uses: actions/cache@v4
        with:
          path: my-portfolio/.cache/fonts
          key: ${{ runner.os }}-srcfont-${{ hashFiles('my-portfolio/scripts/subset-font.mjs') }}

      - name: Install dependencies
        run: npm ci

      # 字型 subset 與圖片轉檔的唯一產生來源 —— 產物不進版控，
      # 每次建置都由這裡重新產出，所以在 GitHub 網頁上改文章或
      # 上傳圖片都不需要任何本機環境。
      # （prebuild 也會觸發，這裡獨立跑是為了讓 log 好定位。）
      - name: Prepare assets (font subset + image conversion)
        run: npm run prepare:assets

      - name: Build static files
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### 產出大小" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh out >> "$GITHUB_STEP_SUMMARY"
          du -sh out/_next/static out/covers 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./my-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
